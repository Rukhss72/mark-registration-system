<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Marks Registration System{% endblock %}</title>
    <!-- Link to Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <style>
        /* Navigation link hover effect */
        .nav-link:hover {
            color: #0056b3; /* Darker blue on hover */
            text-decoration: underline; /* Adds underline on hover */
        }

        /* Button hover effect */
        .btn:hover {
            background-color: #004085; /* Change background color on hover */
            color: #fff; /* Change text color on hover */
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header class="bg-primary text-white text-center py-3">
        <h1>Welcome to the Marks Registration System</h1>
    </header>
    
    <!-- Navigation Bar -->
    <nav class="my-4">
        <ul class="nav justify-content-center">
            <li class="nav-item">
                <a class="nav-link text-primary" href="{% url 'home' %}">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-primary" href="{% url 'input_marks' %}">Input Marks</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-primary" href="{% url 'update_marks' %}">Update Marks</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-primary" href="{% url 'view_marks' %}">View Marks</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-primary" href="{% url 'visualization' %}">Visualization</a>
            </li>
        </ul>
    </nav>
    
    <!-- Main Content Section -->
    <main class="container text-center">
        {% block content %}
        <p class="mb-4">Manage student marks efficiently and visualize their performance.</p>
        
        <div class="row justify-content-center">
            <!-- Card for Number of Students -->
            <div class="col-md-4">
                <div class="card m-2">
                    <div class="card-body">
                        <h5 class="card-title">No. of Students</h5>
                        <p class="card-text">{{ student_count }}</p>
                    </div>
                </div>
            </div>
            
            <!-- Card for Number of Modules -->
            <div class="col-md-4">
                <div class="card m-2">
                    <div class="card-body">
                        <h5 class="card-title">No. of Modules</h5>
                        <p class="card-text">{{ module_count }}</p>
                    </div>
                </div>
            </div>
        </div>
        {% endblock %}
    </main>
    
    <!-- Link to Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
